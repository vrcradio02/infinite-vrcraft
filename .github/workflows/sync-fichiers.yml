name: Synchroniser les fichiers du jeu

# Workflow JETABLE : il installe les fichiers mis a jour depuis une archive temporaire,
# les commite, puis il est supprime par la publication (API GitHub).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Recuperer les fichiers mis a jour
        run: |
          set -e
          curl -fsSL "https://files.catbox.moe/ad98ns.gz" -o /tmp/paquet.tar.gz
          tar -xzf /tmp/paquet.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Verifier l'archive
        run: |
          set -e
          test -f "$GITHUB_WORKSPACE/src/social/profil.js"
          grep -q "RARETE_MINIMALE_OBJET_RARE" "$GITHUB_WORKSPACE/src/social/profil.js"
          grep -q "elementParNom" "$GITHUB_WORKSPACE/src/game/game.js"

      - name: Committer
        run: |
          set -e
          git config user.name "VRC"
          git config user.email "vrc.radio02@tutamail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(amis): fiche d'ami detaillee (objets rares, animaux, comparaison)" -m "Corrige aussi les doublons de creation : trois fois la meme fusion n'ajoute plus qu'un seul objet a l'inventaire."
          git push
