name: Verifier le projet

# Ce workflow ne publie RIEN : GitHub Pages publie directement la branche `main`
# (Settings -> Pages -> Deploy from a branch -> main / root), ce qui ne demande aucun build.
# Il sert uniquement a verifier chaque modification : registre, coherence, tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Le projet n'a AUCUNE dependance : rien a installer.
      - name: Compiler le registre officiel
        run: npm run build

      - name: Verifications (modules, selecteurs, fumee) et validation du registre
        run: npm run check

      - name: Tests automatises
        run: npm test
